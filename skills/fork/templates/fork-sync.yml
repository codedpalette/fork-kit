name: Fork sync

on:
  schedule:
    # Off the hour on purpose: GitHub's scheduler is busiest at minute 0,
    # where runs start late or are dropped under load.
    - cron: '{{cron}}'
  workflow_dispatch:

# One sync at a time: a slow verify must not overlap the next scheduled run.
concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: {{kit_repo}}/.github/workflows/sync.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # By name, not "inherit": the kit gets only this secret. Its value comes
    # from the fork-sync environment, inside the kit's push job.
    secrets:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

  release:                                                      # tip:remove
    needs: sync                                                 # tip:remove
    if: needs.sync.outputs.merged == 'true'                     # tip:remove
    uses: {{kit_repo}}/.github/workflows/release.yml@v1         # tip:remove
    permissions:                                                # tip:remove
      contents: write                                           # tip:remove
