# Fork configuration, read by the fork skill and the fork-kit workflows.
# Contract: https://github.com/{{kit_repo}}#forkyml
schema: 1
kit: v1
kit-repo: {{kit_repo}}
# owner/name
upstream: {{upstream}}
# Upstream's default branch, not kept in the fork
mirror: {{mirror}}
# Our default branch: upstream plus our patches
trunk: {{trunk}}
# setup-node version for verify and build
node: {{node}}
sync:
  # release | tag | tip
  source: {{source}}
  # Text before the version in upstream's tags, for example release-
  tag-prefix: {{tag_prefix}}
  verify: {{verify}}
release:
  # Version = <upstream base>-<suffix>.<N>
  suffix: {{suffix}}
  build: {{build}}
  # Only read for source: tip
  version-file: {{version_file}}
  # File -> jq filter, with $version defined
  stamp: {{stamp}}
  # Attached to the GitHub Release
  assets: {{assets}}
  # Force-added into a tag-only commit, for git-URL installs
  commit: {{commit}}
