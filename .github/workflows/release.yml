name: Release

# Reusable workflow: publishes a fork release, versioned
# <upstream base>-<suffix>.<N>. Forks call it from fork-release.yml (on a push
# to the trunk, or by hand) and from fork-sync.yml after a merge.
#
# ---------------------------------------------------------------------------
# SECURITY: READ THIS BEFORE YOU EDIT THIS FILE
#
# The build runs upstream's code (install, verify, build). A step can plant
# things for the later steps of its own job (a fake `gh` on PATH, variables in
# GITHUB_ENV), so the build and the publishing never share a job:
#
#   build    runs upstream's code. Read-only permissions, no secrets, no
#            github.token, and every checkout sets persist-credentials: false.
#            It hands the built files over as one tar artifact.
#   publish  can write tags and releases, with SYNC_TOKEN from the fork-sync
#            environment, which only the trunk can use. The fork's rulesets let
#            only admins (the token's owner) create tags, so a workflow's own
#            GITHUB_TOKEN can never publish a release. It runs only git, gh, tar and the
#            kit's own scripts on the files from the artifact: no npm, node or
#            other interpreter, no eval or sh -c, no action except checkout and
#            download-artifact, and never the fork's verify or build command.
#
# test/check-isolation checks these in CI. If a change needs to break one,
# redesign it instead of loosening the check.
# ---------------------------------------------------------------------------
#
# Nothing is committed to the trunk. Stamped fields (version, name, id) exist
# only in the released files, so upstream's version bumps never conflict.

on:
  # The caller passes SYNC_TOKEN by name; its value comes from the fork-sync
  # environment of the publish job. See sync.yml for why.
  workflow_call:
    secrets:
      SYNC_TOKEN:
        required: false
    inputs:
      version:
        description: Version to publish, instead of the computed one
        type: string
        default: ''
      ref:
        description: >-
          Trunk commit to build. A sync passes the commit it pushed: the run
          itself started on the trunk as it was before the merge.
        type: string
        default: ''
    outputs:
      tag:
        description: The published release tag
        value: ${{ jobs.publish.outputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out the trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the kit
        id: kit
        working-directory: fork
        # The kit is checked out by a ref that only a tag or a commit can
        # match: actions/checkout tries a branch before a tag for a bare name,
        # so a branch named v1 in the kit repository would otherwise win.
        run: |
          kit="$(yq -r '.kit // "v1"' .github/fork.yml)"
          if [[ "$kit" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$kit"
          elif [[ "$kit" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            ref="refs/tags/$kit"
          else
            echo "::error::fork.yml kit '$kit' must be a version tag such as v1, or a full commit SHA."
            exit 1
          fi
          echo "repo=$(yq -r '.["kit-repo"] // ""' .github/fork.yml)" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false

      - name: Read fork.yml
        id: config
        working-directory: fork
        run: ../kit/bin/fork-config .github/fork.yml >>"$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        working-directory: fork
        env:
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          SOURCE: ${{ steps.config.outputs.source }}
          MIRROR: ${{ steps.config.outputs.mirror }}
          SUFFIX: ${{ steps.config.outputs.suffix }}
          VERSION_FILE: ${{ steps.config.outputs.version-file }}
          TAG_PREFIX: ${{ steps.config.outputs.tag-prefix }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # Upstream's tags give the base; the fork's own tags give N. A tip
          # fork without a version file is based on upstream's commit date.
          # Upstream's tags go to refs/upstream-tags/, apart from the fork's
          # own release tags, so the two can never collide.
          git fetch -q --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/heads/$MIRROR:refs/remotes/upstream/$MIRROR" "+refs/tags/*:refs/upstream-tags/*"

          base="$(../kit/bin/base-version "$SOURCE" "$VERSION_FILE" "upstream/$MIRROR" "$TAG_PREFIX")" || {
            echo "::error::Found no upstream version to base the release on."
            exit 1
          }
          # The release builds the trunk under the base's label, so the trunk
          # must hold no upstream code newer than that release.
          if [ "$SOURCE" != tip ] && ! ../kit/bin/check-released "refs/upstream-tags/$TAG_PREFIX$base" "upstream/$MIRROR"; then
            echo "::error::The trunk holds upstream code that $base does not. Rebuild it from $base plus the fork's own commits: see the fork skill, work.md, feature."
            exit 1
          fi
          if [ -n "$REQUESTED" ]; then
            # Only <base>-<suffix>.<N> for the trunk's own base. Any workflow
            # with actions: write can start this one, and a made-up version
            # such as 99.0.0 would sort above every later release.
            n="${REQUESTED#"$base-$SUFFIX."}"
            if [ "$n" = "$REQUESTED" ] || ! [[ "$n" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Not a valid version: $REQUESTED. Use $base-$SUFFIX.<N>."
              exit 1
            fi
            version="$REQUESTED"
          else
            version="$(../kit/bin/next-version "$base" "$SUFFIX")"
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists."
            exit 1
          fi

          {
            echo "version=$version"
            echo "base=$base"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::Building $version (upstream $base)."

      - name: Stamp the files
        working-directory: fork
        env:
          STAMP: ${{ steps.config.outputs.stamp }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -r 'to_entries[] | [.key, .value] | @tsv' <<<"$STAMP" |
            while IFS=$'\t' read -r file filter; do
              jq --arg version "$VERSION" "$filter" "$file" >"$file.stamped"
              cat "$file.stamped" >"$file" && rm "$file.stamped"
              echo "Stamped $file"
            done

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.config.outputs.node }}

      - name: Verify
        working-directory: fork
        env:
          VERIFY: ${{ steps.config.outputs.verify }}
        run: bash -euo pipefail -c "$VERIFY"

      - name: Build
        working-directory: fork
        env:
          BUILD: ${{ steps.config.outputs.build }}
        run: bash -euo pipefail -c "$BUILD"

      - name: Pack the release files
        working-directory: fork
        env:
          STAMP: ${{ steps.config.outputs.stamp }}
          ASSETS: ${{ steps.config.outputs.assets }}
          COMMIT: ${{ steps.config.outputs.commit }}
        run: |
          jq -nr --argjson s "$STAMP" --argjson a "$ASSETS" --argjson c "$COMMIT" \
            '($s | keys) + $a + $c | unique | .[]' >../release-files.txt
          if [ ! -s ../release-files.txt ]; then
            echo "::error::fork.yml lists no release files: set release.assets or release.commit."
            exit 1
          fi
          tar -cf ../release.tar -T ../release-files.txt

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: fork-sync
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.build.outputs.version }}
    steps:
      - name: Check for the token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not in this fork's fork-sync environment, or the caller does not pass it."
            exit 1
          fi

      # No credentials in git: the token is handed to the one push that
      # needs it, so nothing that reads .git/config can find it.
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the kit
        id: kit
        working-directory: fork
        # The kit is checked out by a ref that only a tag or a commit can
        # match: actions/checkout tries a branch before a tag for a bare name,
        # so a branch named v1 in the kit repository would otherwise win.
        run: |
          kit="$(yq -r '.kit // "v1"' .github/fork.yml)"
          if [[ "$kit" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$kit"
          elif [[ "$kit" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            ref="refs/tags/$kit"
          else
            echo "::error::fork.yml kit '$kit' must be a version tag such as v1, or a full commit SHA."
            exit 1
          fi
          echo "repo=$(yq -r '.["kit-repo"] // ""' .github/fork.yml)" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false

      - name: Read fork.yml
        id: config
        working-directory: fork
        run: ../kit/bin/fork-config .github/fork.yml >>"$GITHUB_OUTPUT"

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Publish
        working-directory: fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          SUFFIX: ${{ steps.config.outputs.suffix }}
          SOURCE: ${{ steps.config.outputs.source }}
          MIRROR: ${{ steps.config.outputs.mirror }}
          STAMP: ${{ steps.config.outputs.stamp }}
          ASSETS: ${{ steps.config.outputs.assets }}
          COMMIT: ${{ steps.config.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
          BASE: ${{ needs.build.outputs.base }}
          TAG_PREFIX: ${{ steps.config.outputs.tag-prefix }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/*:refs/upstream-tags/*"

          # The archive comes from the build job, which ran upstream's code.
          # Unpack it into an empty directory outside the checkout, and check
          # every entry before anything uses it.
          rm -rf ../out && mkdir ../out
          tar -xf ../release.tar -C ../out --no-same-owner
          mapfile -t listed < <(jq -nr --argjson s "$STAMP" --argjson a "$ASSETS" --argjson c "$COMMIT" \
            '($s | keys) + $a + $c | unique | .[]')
          ../kit/bin/check-release-files ../out "${listed[@]}"

          # The build can rewrite a stamped file, for example manifest.json
          # from package.json, and ship upstream's version, name or id. Each
          # stamped file must still match its filter: stamping it again changes
          # nothing. A fork that stamps nothing has nothing to check.
          while IFS=$'\t' read -r file filter; do
            if ! jq -e --arg version "$VERSION" "($filter) == ." "../out/$file" >/dev/null; then
              echo "::error::The build changed the stamped fields of $file. Stamp it after the build, or stop the build from writing it."
              exit 1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<<"$STAMP")

          # The token reaches git through a credential helper that reads it
          # from the environment, so it is never stored or put on a command line.
          push() {
            # shellcheck disable=SC2016 # git expands $GH_TOKEN when it runs the helper
            git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              push -q "https://github.com/$GH_REPO.git" "$@"
          }
          # GitHub occasionally rejects a push with a transient server error.
          retry() { local d; for d in 0 5 20; do sleep "$d"; "$@" && return 0; done; return 1; }

          # Notes. A release on a new upstream base links upstream's own
          # changelog. The fork's commits since the previous fork release are
          # listed, without upstream's commits and without commits that touch
          # only the fork's tooling (.github/ and FORK.md). A first release
          # lists the fork's patches on top of the upstream base instead.
          # Not --merged: in commit mode, release tags point off the trunk.
          previous="$(git tag -l "*-$SUFFIX.*" --sort=-creatordate | grep -vx "$VERSION" | head -n 1 || true)"
          previous_base="${previous%-"$SUFFIX".*}"

          {
            if [ "$SOURCE" = tip ]; then
              git fetch -q "https://github.com/$UPSTREAM.git" "+refs/heads/$MIRROR:refs/remotes/upstream/$MIRROR"
              tip="$(git merge-base "$SHA" "upstream/$MIRROR")"
              echo "Built from upstream \`$MIRROR\` at [\`${tip:0:12}\`](https://github.com/$UPSTREAM/commit/$tip), with this fork's patches."
            elif [ "$previous_base" = "$BASE" ]; then
              echo "Same upstream base as $previous: \`$BASE\`."
            elif gh release view "$TAG_PREFIX$BASE" --repo "$UPSTREAM" >/dev/null 2>&1; then
              echo "Updates to upstream \`$BASE\`. Upstream's changes: [release notes](https://github.com/$UPSTREAM/releases/tag/$TAG_PREFIX$BASE)."
            elif [ -n "$previous_base" ]; then
              echo "Updates to upstream \`$BASE\`. Upstream's changes: [$previous_base...$BASE](https://github.com/$UPSTREAM/compare/$TAG_PREFIX$previous_base...$TAG_PREFIX$BASE)."
            else
              echo "Built from upstream [\`$BASE\`](https://github.com/$UPSTREAM/tree/$TAG_PREFIX$BASE)."
            fi

            exclude=("^refs/upstream-tags/$TAG_PREFIX$BASE")
            [ "$SOURCE" = tip ] && exclude=("^upstream/$MIRROR")
            if [ -n "$previous" ]; then
              range=("$previous..$SHA")
              heading="Fork changes since $previous"
            else
              range=("$SHA")
              heading="This fork's patches on top of upstream"
            fi
            changes="$(git log --no-merges --format='- %s' "${range[@]}" "${exclude[@]}" -- . ':(exclude).github' ':(exclude)FORK.md' 2>/dev/null || true)"
            if [ -n "$changes" ]; then
              echo
              echo "## $heading"
              echo
              echo "$changes"
            fi
          } >../notes.md

          assets=()
          while read -r file; do assets+=("../out/$file"); done < <(jq -r '.[]' <<<"$ASSETS")
          mapfile -t stamped < <(jq -r 'keys[]' <<<"$STAMP")
          built="$VERSION"

          # A deleted immutable release locks its tag name for good, and only
          # creating the release shows that. Then the next N is tried: the
          # stamp files are stamped again, and the run stops if another built
          # file holds the version, because only a new build can change it.
          for attempt in 1 2 3 4 5; do
            # Commit mode: the built files go into a commit that only the tag
            # points at, for installs that read the git tree (npm git URLs).
            # Only the listed paths are copied into the checkout.
            target="$SHA"
            if [ "$(jq length <<<"$COMMIT")" -gt 0 ]; then
              mapfile -t paths < <(jq -nr --argjson s "$STAMP" --argjson c "$COMMIT" '($s | keys) + $c | unique | .[]')
              for path in "${paths[@]}"; do
                [ -e "../out/$path" ] || continue
                rm -rf -- "$path"
                mkdir -p -- "$(dirname -- "$path")"
                cp -R -- "../out/$path" "$path"
                git add -f -- "$path"
              done
              git commit -q -m "chore(release): $VERSION [skip ci]"
              git tag -a "$VERSION" -m "Release $VERSION"
              retry push "refs/tags/$VERSION"
              target="$(git rev-parse HEAD)"
            fi

            # A server error or a timeout is tried again with the same version.
            # gh uploads the assets to a draft and publishes it last, so a
            # draft left by a failed try is deleted first, and a release that
            # was published before the error counts as done.
            for delay in 0 5 20; do
              sleep "$delay"
              status=0
              output="$(gh release create "$VERSION" --target "$target" --title "$VERSION" \
                --notes-file ../notes.md "${assets[@]}" 2>&1)" || status=$?
              echo "$output"
              if [ "$status" != 0 ] && grep -Eqi 'HTTP 5[0-9][0-9]|timeout|timed out|connection reset|unexpected EOF' <<<"$output"; then
                draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
                if [ "$draft" = false ]; then status=0; break; fi
                if [ "$draft" = true ]; then gh release delete "$VERSION" --yes; fi
                echo "::warning::GitHub did not answer. Trying $VERSION again."
                continue
              fi
              break
            done
            if [ "$status" = 0 ]; then
              echo "::notice::Published $VERSION."
              exit 0
            fi
            if ! grep -q 'used by an immutable release' <<<"$output" || [ "$attempt" = 5 ] ||
              ! [[ "$VERSION" =~ \.[0-9]+$ ]]; then
              echo "::error::Could not create the release $VERSION."
              exit 1
            fi

            echo "::warning::The name $VERSION belonged to a deleted immutable release. Trying the next one."
            if [ "$target" != "$SHA" ]; then
              retry push --delete "refs/tags/$VERSION"
              git tag -d "$VERSION" >/dev/null
              git reset -q --hard "$SHA"
            fi
            VERSION="${VERSION%.*}.$((${VERSION##*.} + 1))"
            for file in "${stamped[@]}"; do
              filter="$(jq -r --arg file "$file" '.[$file]' <<<"$STAMP")"
              jq --arg version "$VERSION" "$filter" "../out/$file" >../stamped.json
              cat ../stamped.json >"../out/$file"
            done
            if grep -rlF -- "$built" ../out | grep -vxF -f <(printf '../out/%s\n' "${stamped[@]}"); then
              echo "::error::These built files hold the version $built. Run the release again with the version $VERSION."
              exit 1
            fi
          done
