name: Distribute SYNC_TOKEN

# Copies this repository's SYNC_TOKEN secret into one fork, or into every fork
# of this account (`all` = every repository whose default branch has
# .github/fork.yml). The skill runs it for each new fork, and you run it with
# `all` after rotating the token.
#
# The token goes into each fork's fork-sync environment, which only the
# fork's trunk can use, and any repository-level copy is deleted: a repository
# secret is readable by every workflow in the fork, on any branch. The fork
# skill creates the environment when it sets up a fork. The token needs the
# Environments (write) and Secrets (write) permissions for this.
#
# Only accounts with write access here can dispatch it, and it refuses any
# repository outside this account. It runs no third-party code: only gh.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '<owner>/<name> in this account, or "all"'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribute-secret

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Copy SYNC_TOKEN
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET: ${{ inputs.repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = all ]; then
            repos=()
            while read -r repo; do
              if gh api "repos/$repo/contents/.github/fork.yml" --silent 2>/dev/null; then
                repos+=("$repo")
              fi
            done < <(gh repo list "$OWNER" --limit 1000 --no-archived --json nameWithOwner -q '.[].nameWithOwner')
          else
            if ! [[ "$TARGET" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Not a repository name: $TARGET"
              exit 1
            fi
            if [ "${TARGET%%/*}" != "$OWNER" ]; then
              echo "::error::$TARGET is outside $OWNER, refusing to copy the token there."
              exit 1
            fi
            repos=("$TARGET")
          fi

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::notice::No forks found."
            exit 0
          fi

          failed=0
          for repo in "${repos[@]}"; do
            # From stdin, so the token never appears in a process list.
            if ! printf '%s' "$SYNC_TOKEN" | gh secret set SYNC_TOKEN --env fork-sync -R "$repo"; then
              echo "::error::Could not set SYNC_TOKEN in the fork-sync environment of $repo. Does the environment exist?"
              failed=1
              continue
            fi
            if gh secret list -R "$repo" --json name -q '.[].name' | grep -qx SYNC_TOKEN; then
              gh secret delete SYNC_TOKEN -R "$repo"
              echo "::notice::Deleted the repository-level SYNC_TOKEN of $repo."
            fi
            echo "::notice::SYNC_TOKEN set in the fork-sync environment of $repo"
          done
          exit "$failed"
