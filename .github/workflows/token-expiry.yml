name: SYNC_TOKEN expiry

# Opens an issue, assigned to the account owner, when SYNC_TOKEN is about to
# expire or no longer works. GitHub sends no failure email for this, and an
# expired token silently stops every fork's sync. On later runs it comments on
# the open issue instead of opening another one.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      warn-days:
        description: 'Warn when the token expires within this many days'
        type: number
        default: 14

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the expiry date
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          WARN_DAYS: ${{ inputs.warn-days || 14 }}
        run: |
          set -euo pipefail

          headers="$(mktemp)"
          status="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $SYNC_TOKEN" https://api.github.com/rate_limit)"

          if [ "$status" != 200 ]; then
            title='SYNC_TOKEN is invalid or expired'
            body="An API call with SYNC_TOKEN returned HTTP $status. Every fork's sync fails until you replace it. See the README section \"Rotate the token\"."
          else
            expires="$(tr -d '\r' <"$headers" |
              awk -F': ' 'tolower($1) == "github-authentication-token-expiration" { print $2 }')"
            if [ -z "$expires" ]; then
              echo "::notice::SYNC_TOKEN has no expiry date."
              exit 0
            fi
            days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
            if [ "$days" -gt "$WARN_DAYS" ]; then
              echo "::notice::SYNC_TOKEN expires on $expires, in $days days."
              exit 0
            fi
            title="SYNC_TOKEN expires on $(date -d "$expires" +%F)"
            body="SYNC_TOKEN expires in $days days ($expires). Regenerate it and copy it to the forks, as the README section \"Rotate the token\" describes."
          fi

          # The list API, not search: search indexes new issues with a delay.
          open="$(gh issue list --state open --json number,title \
            -q '[.[] | select(.title | startswith("SYNC_TOKEN"))][0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee "$OWNER"
          fi
          echo "::warning::$title"
