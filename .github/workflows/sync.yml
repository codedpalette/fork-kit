name: Sync upstream

# Reusable workflow: merges upstream's latest release (or tip) into the fork's
# trunk. Forks call it from their fork-sync.yml.
#
# ---------------------------------------------------------------------------
# SECURITY: READ THIS BEFORE YOU EDIT THIS FILE
#
# SYNC_TOKEN can write code and workflows in the fork. Upstream's code runs
# in two places, and neither may reach the token:
#
# 1. In this workflow: the fork's verify command installs upstream's
#    dependencies and runs its tests, on a schedule, with nobody watching.
# 2. As upstream's own GitHub workflows. GitHub runs the workflow files of a
#    pushed commit, and of the default branch, with the repository's secrets.
#    So no commit pushed here may contain upstream's .github/workflows or
#    .github/actions: bin/merge-upstream strips them from every merge into
#    the trunk, bin/strip-upstream-ci from every sync/<ref> branch, and
#    upstream's default branch is never pushed to the fork. On top of that,
#    the token lives in the fork-sync environment, which only the trunk can
#    use.
#
# The two jobs keep upstream's code and the token apart. Keep these
# invariants:
#
#   merge  runs upstream's code. It never references SYNC_TOKEN, has only
#          read permissions, and every checkout sets
#          persist-credentials: false. A step that needs GITHUB_TOKEN gets it
#          in that step's env only, never in the verify step.
#   push   holds SYNC_TOKEN. It runs only git, gh and the kit's own scripts:
#          no npm, yarn, node or other interpreter, no eval or sh -c, no
#          action except actions/checkout, and never the fork's verify or
#          build command, not even indirectly. It repeats the merge and pushes
#          only the tree that the merge job verified.
#   other  Any new job gets no SYNC_TOKEN.
#
# test/check-isolation checks these in CI (test/isolation.bats). If
# a change needs to break an invariant, redesign it instead of loosening the
# check.
# ---------------------------------------------------------------------------
#
# A conflict is parked in a sync/<ref> PR assigned to the owner, and the run
# stays green: the open PR is the reminder, not a daily failure email.

on:
  # The caller passes SYNC_TOKEN by name. At the caller its value is empty:
  # the token is not a repository secret, which every workflow in the fork
  # could read. It lives in the fork-sync environment, and GitHub fills a
  # passed secret from the environment of the job that runs in it, here the
  # push job. Without the name passed, the job sees nothing: tested.
  workflow_call:
    secrets:
      SYNC_TOKEN:
        required: false
    outputs:
      merged:
        description: '"true" when upstream was merged into the trunk and pushed'
        value: ${{ jobs.push.outputs.merged }}
      ref:
        description: The upstream release tag, or branch for the tip
        value: ${{ jobs.merge.outputs.ref }}
      sha:
        description: The trunk commit that the push job pushed, when merged is "true"
        value: ${{ jobs.push.outputs.sha }}

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.merge.outputs.result }}
      ref: ${{ steps.find.outputs.ref }}
      sha: ${{ steps.find.outputs.sha }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - name: Check out the trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          fetch-depth: 0
          persist-credentials: false

      - name: Find the kit
        id: kit
        working-directory: fork
        # The kit is checked out by a ref that only a tag or a commit can
        # match: actions/checkout tries a branch before a tag for a bare name,
        # so a branch named v1 in the kit repository would otherwise win.
        run: |
          kit="$(yq -r '.kit // "v1"' .github/fork.yml)"
          if [[ "$kit" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$kit"
          elif [[ "$kit" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            ref="refs/tags/$kit"
          else
            echo "::error::fork.yml kit '$kit' must be a version tag such as v1, or a full commit SHA."
            exit 1
          fi
          echo "repo=$(yq -r '.["kit-repo"] // ""' .github/fork.yml)" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false

      - name: Read fork.yml
        id: config
        working-directory: fork
        run: |
          ../kit/bin/fork-config .github/fork.yml >>"$GITHUB_OUTPUT"
          trunk="$(yq -r .trunk .github/fork.yml)"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "$trunk" ]; then
            echo "::error::This run checked out $branch, but fork.yml names the trunk $trunk. Make $trunk the default branch."
            exit 1
          fi

      - name: Find upstream's release
        id: find
        working-directory: fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          MIRROR: ${{ steps.config.outputs.mirror }}
          SOURCE: ${{ steps.config.outputs.source }}
          TAG_PREFIX: ${{ steps.config.outputs.tag-prefix }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          # Upstream's tags go to refs/upstream-tags/, apart from the fork's own
          # release tags, so the two can never collide.
          git fetch -q --no-tags upstream "+refs/heads/$MIRROR:refs/remotes/upstream/$MIRROR" \
            "+refs/tags/*:refs/upstream-tags/*"

          if [ "$SOURCE" = tip ]; then
            ref="$MIRROR"
            sha="$(git rev-parse "upstream/$MIRROR")"
          else
            rc=0
            ref="$(../kit/bin/upstream-release "$UPSTREAM" "$SOURCE" "$TAG_PREFIX")" || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::error::$UPSTREAM has no $SOURCE release. To follow its branch instead, set sync.source to tip in .github/fork.yml."
              exit 1
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
            if ! sha="$(git rev-parse -q --verify "refs/upstream-tags/$ref^{commit}")"; then
              echo "::error::Upstream's release $ref has no tag in $UPSTREAM. Upstream deleted or renamed it."
              exit 1
            fi
          fi

          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        working-directory: fork
        env:
          REF: ${{ steps.find.outputs.ref }}
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # [skip ci] stops the push from triggering the fork's release
          # workflow a second time: the caller runs the release itself.
          result="$(../kit/bin/merge-upstream "$SHA" "Merge upstream $REF [skip ci]")"
          case "$result" in
            current) echo "::notice::The trunk already contains upstream $REF." ;;
            conflict) echo "::warning::Upstream $REF conflicts with the trunk." ;;
          esac

          echo "result=$result" >>"$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.config.outputs.node }}

      - name: Verify the merge
        if: steps.merge.outputs.result == 'merged'
        working-directory: fork
        env:
          VERIFY: ${{ steps.config.outputs.verify }}
        run: bash -euo pipefail -c "$VERIFY"

  push:
    needs: merge
    runs-on: ubuntu-latest
    # The token is an environment secret that only the trunk can use. A job
    # on any other branch, such as an upstream workflow, cannot read it.
    environment: fork-sync
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      merged: ${{ steps.push.outputs.merged }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check for the token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not in this fork's fork-sync environment. Run the kit's distribute-secret.yml for this fork."
            exit 1
          fi

      # No credentials in git: the token is handed to each push through a
      # credential helper, so nothing that reads .git/config can find it.
      - name: Check out the trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
          persist-credentials: false

      - name: Find the kit
        id: kit
        working-directory: fork
        # The kit is checked out by a ref that only a tag or a commit can
        # match: actions/checkout tries a branch before a tag for a bare name,
        # so a branch named v1 in the kit repository would otherwise win.
        run: |
          kit="$(yq -r '.kit // "v1"' .github/fork.yml)"
          if [[ "$kit" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$kit"
          elif [[ "$kit" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            ref="refs/tags/$kit"
          else
            echo "::error::fork.yml kit '$kit' must be a version tag such as v1, or a full commit SHA."
            exit 1
          fi
          echo "repo=$(yq -r '.["kit-repo"] // ""' .github/fork.yml)" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.kit.outputs.repo }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false

      - name: Read fork.yml
        id: config
        working-directory: fork
        run: ../kit/bin/fork-config .github/fork.yml >>"$GITHUB_OUTPUT"

      # Upstream is only fetched. Its default branch is never pushed to the
      # fork: that push would run upstream's workflows there.
      - name: Fetch upstream
        working-directory: fork
        env:
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          MIRROR: ${{ steps.config.outputs.mirror }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          # Upstream's tags go to refs/upstream-tags/, apart from the fork's own
          # release tags, so the two can never collide.
          git fetch -q --no-tags upstream "+refs/heads/$MIRROR:refs/remotes/upstream/$MIRROR" \
            "+refs/tags/*:refs/upstream-tags/*"

      - name: Push the merge
        id: push
        if: needs.merge.outputs.result == 'merged'
        working-directory: fork
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TRUNK: ${{ steps.config.outputs.trunk }}
          REF: ${{ needs.merge.outputs.ref }}
          SHA: ${{ needs.merge.outputs.sha }}
          TREE: ${{ needs.merge.outputs.tree }}
        run: |
          # The token reaches git through a credential helper that reads it
          # from the environment, so it is never stored or put on a command line.
          # shellcheck disable=SC2016 # git expands $PUSH_TOKEN when it runs the helper
          push() { git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' push "$@"; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # GitHub occasionally rejects a push with a transient server error.
          retry() { local d; for d in 0 5 20; do sleep "$d"; "$@" && return 0; done; return 1; }
          git rev-parse -q --verify "$SHA^{commit}" >/dev/null || git fetch -q upstream "$SHA"
          result="$(../kit/bin/merge-upstream "$SHA" "Merge upstream $REF [skip ci]")"

          if [ "$result" != merged ] || [ "$(git rev-parse 'HEAD^{tree}')" != "$TREE" ]; then
            echo "::error::The merge differs from the one that passed verify. The trunk is unchanged."
            exit 1
          fi

          retry push -q origin "HEAD:refs/heads/$TRUNK"
          echo "merged=true" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "::notice::Merged upstream $REF into $TRUNK."

      - name: Park the conflict in a PR
        if: needs.merge.outputs.result == 'conflict'
        working-directory: fork
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TRUNK: ${{ steps.config.outputs.trunk }}
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          SOURCE: ${{ steps.config.outputs.source }}
          VERIFY: ${{ steps.config.outputs.verify }}
          REF: ${{ needs.merge.outputs.ref }}
          SHA: ${{ needs.merge.outputs.sha }}
        run: |
          # GitHub occasionally rejects a push with a transient server error.
          retry() { local d; for d in 0 5 20; do sleep "$d"; "$@" && return 0; done; return 1; }
          # The token reaches git through a credential helper that reads it
          # from the environment, so it is never stored or put on a command line.
          # shellcheck disable=SC2016 # git expands $PUSH_TOKEN when it runs the helper
          push() { git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' push "$@"; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rev-parse -q --verify "$SHA^{commit}" >/dev/null || git fetch -q upstream "$SHA"

          # The branch is upstream's code plus one commit that removes
          # upstream's CI, so pushing it runs none of upstream's workflows.
          branch="sync/$REF"
          git switch -q --detach "$SHA"
          ../kit/bin/strip-upstream-ci "Remove upstream CI from the sync branch [skip ci]"
          head="$(git rev-parse HEAD)"
          git switch -q "$TRUNK"
          retry push -q --force origin "$head:refs/heads/$branch"

          pr="$(gh pr list --base "$TRUNK" --head "$branch" --state open --json number -q '.[0].number // empty')"
          if [ -n "$pr" ]; then
            created="$(gh pr view "$pr" --json createdAt -q .createdAt)"
            age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
            echo "::notice::Upstream $REF still conflicts. PR #$pr is $age days old."
            if [ "$age" -gt 0 ] && [ $(( age % 7 )) -eq 0 ]; then
              gh pr comment "$pr" --body "Still conflicting after $age days. Syncs and releases from upstream stay paused."
            fi
            exit 0
          fi

          # Repeat the merge only to list the conflicting files for the PR body.
          git merge -q --no-commit --no-ff "$head" >/dev/null 2>&1 || true
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          files="$(git diff --name-only --diff-filter=U | sed 's/.*/- `&`/')"
          git merge --abort 2>/dev/null || true
          # Upstream changes to the fork's own files are refused even when
          # they merge cleanly, so name them separately.
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          owned="$(git diff --name-only "$(git merge-base HEAD "$head")" "$head" -- \
            .github/fork.yml FORK.md '.github/workflows/fork-*' | sed 's/.*/- `&`/')"
          if [ -n "$owned" ]; then
            files="$(printf '%s\n\nUpstream changes these files, which belong to this fork. Keep the fork'"'"'s version of each:\n\n%s' "${files:-- (none)}" "$owned")"
          fi

          if [ "$SOURCE" = tip ]; then
            release_note="This fork follows the upstream tip, so nothing releases on its own. To release, run \`gh workflow run fork-release.yml\`."
          else
            release_note="GitHub then marks this PR as merged, and the fork's release workflow publishes a new release."
          fi

          if [ "$VERIFY" = true ]; then
            verify_step="4. This fork has no verify command. Build or test the result by hand before you push."
          else
            # printf, so that the command only ever appears as text in the body.
            # shellcheck disable=SC2016 # the backticks are Markdown
            verify_step="$(printf '4. Run the fork'"'"'s verify command:\n\n   ```bash\n   %s\n   ```' "$VERIFY")"
          fi

          cat >body.md <<BODY
          The scheduled sync could not merge [\`$REF\`](https://github.com/$UPSTREAM/tree/$REF) of upstream [$UPSTREAM](https://github.com/$UPSTREAM) into this fork's trunk \`$TRUNK\`. Syncs and releases from upstream stay paused until this lands.

          | Branch | In this fork | Role |
          |---|---|---|
          | \`$branch\` | upstream \`$REF\`, without upstream's CI | what to merge |
          | \`$TRUNK\` | upstream plus this fork's patches | where the merge goes |

          Conflicting files:

          ${files:-- (none listed)}

          ## Resolve it

          Run these steps in a clone of this fork. If you have none: \`gh repo clone $GH_REPO && cd ${GH_REPO#*/}\`. Do not use the merge button on this PR: a squash or rebase merge drops upstream's commits from the trunk's history, and the next sync conflicts again.

          1. Update the trunk:

             \`\`\`bash
             git fetch origin
             git switch $TRUNK
             git merge --ff-only origin/$TRUNK
             \`\`\`

          2. Merge the upstream release into the trunk:

             \`\`\`bash
             git merge --no-ff -m "Merge upstream $REF" origin/$branch
             \`\`\`

          3. Fix each conflicting file. Where upstream now does what a fork patch did, keep upstream's version. Then finish the merge:

             \`\`\`bash
             git add <files>
             git commit --no-edit
             \`\`\`

          $verify_step

          5. Push the trunk. $release_note

             \`\`\`bash
             git push origin $TRUNK
             \`\`\`

          6. After GitHub shows this PR as merged, delete the \`$branch\` branch from this page.

          Keep upstream's \`.github/workflows\` and \`.github/actions\` out of the trunk: they would run in this fork with its secrets. Never push to upstream. In Claude Code, the fork skill can do these steps: ask it to resolve this sync PR.
          BODY

          gh pr create --base "$TRUNK" --head "$branch" --title "Sync upstream $REF into $TRUNK" \
            --body-file body.md --assignee "$OWNER"
          echo "::warning::Upstream $REF conflicts with $TRUNK. Opened a sync PR."
